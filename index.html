<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu! stats card</title>
<style>
  :root { --bg:#1c1719; --panel:#2a2226; --panel2:#352b30; --pink:#ff66ab; --dim:#b8a8b0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#fff; font-family: system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { margin:0 0 6px; font-size: 32px; } h1 span { color: var(--pink); }
  p { color: var(--dim); margin: 0 0 24px; }
  form { display:flex; gap:10px; flex-wrap:wrap; background:var(--panel); padding:16px; border-radius:14px; }
  input, select, button { font: inherit; border-radius:10px; border:0; padding:12px 14px; }
  input { flex:1; min-width:200px; background:var(--panel2); color:#fff; }
  select { background:var(--panel2); color:#fff; }
  button { background:var(--pink); color:#fff; font-weight:700; cursor:pointer; }
  textarea { width:100%; height:150px; margin-top:16px; background:var(--panel); color:#fff; border:0; border-radius:14px; padding:14px; font: 13px ui-monospace, monospace; }
  #preview { width:100%; margin-top:20px; border-radius:18px; display:none; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  .hint { font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>osu! <span>stats card</span></h1>
  <p>Type any osu! username, copy the BBCode, paste it into that player's <b>me!</b> section. The card updates by itself.</p>
  <form id="f">
    <input id="u" placeholder="osu! username or user ID" required>
    <select id="m">
      <option value="osu">osu!</option><option value="taiko">osu!taiko</option>
      <option value="fruits">osu!catch</option><option value="mania">osu!mania</option>
    </select>
    <button>Generate</button>
  </form>
  <div class="row"><span class="hint">BBCode for the me! page</span><button id="copy" type="button">Copy</button></div>
  <textarea id="code" readonly placeholder="BBCode appears here"></textarea>
  <img id="preview" alt="card preview">
</main>
<script>
  const f = document.getElementById('f'), code = document.getElementById('code'), img = document.getElementById('preview');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('u').value.trim(), m = document.getElementById('m').value;
    if (!u) return;
    code.value = 'Loading…';
    const r = await fetch(`/api/bbcode?u=${encodeURIComponent(u)}&mode=${m}`);
    code.value = await r.text();
    img.style.display = 'block';
    img.src = `/card/${encodeURIComponent(u)}.png?mode=${m}&t=${Date.now()}`;
  });
  document.getElementById('copy').addEventListener('click', () => {
    code.select(); navigator.clipboard?.writeText(code.value);
  });
</script>
</body>
</html>
